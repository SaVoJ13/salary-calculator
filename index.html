<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f2f4f8" id="meta-theme-color">
    <title>ЗП Калькулятор</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./android-chrome-192x192.png">

    <style>
        :root {
            color-scheme: light;
            --bg: #f2f4f8; --surface: #fff; --surface-2: #f1f4f9; --border: #e1e6ee;
            --text-main: #0e1726; --text-muted: #566479; --primary: #2257e7; --primary-soft: #e8effd;
            --on-primary: #fff; --success: #0b7a55; --pro: #8a5200; --pro-soft: #fcefd6;
            --hero-bg: #0f1d3d; --hero-text: #f4f7ff; --hero-muted: #a9b7d6; --hero-net: #6ee7b7;
            --shadow: 0 1px 2px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.05);
            --danger: #dc2626;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #0a0e16; --surface: #121925; --surface-2: #1a2335; --border: #243046;
            --text-main: #edf1f7; --text-muted: #9aa8bf; --primary: #7fa4ff; --primary-soft: #18264a;
            --on-primary: #0a1020; --success: #3fd69b; --pro: #f0b95a; --pro-soft: #32230a;
            --hero-bg: #15223f; --shadow: 0 1px 2px rgba(0,0,0,.4);
        }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--text-main);
            font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Місце для Bottom Tabs + Sticky Aside */
            padding-bottom: calc(180px + env(safe-area-inset-bottom));
            transition: background 0.3s, color 0.3s;
        }

        button { font: inherit; color: inherit; cursor: pointer; border: none; }
        .hidden { display: none !important; }

        /* Вкладки (Views) */
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Topbar */
        .topbar { display: flex; align-items: center; gap: 10px; max-width: 1080px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
        .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
        .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
        h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; font-weight: 700;}
        
        .pro-badge { display: none; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: var(--pro-soft); color: var(--pro); text-transform: uppercase; letter-spacing: 0.5px;}
        .is-logged-in .pro-badge { display: inline-block; }

        .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
        .sun, [data-theme=dark] .moon { display: none; } [data-theme=dark] .sun { display: block; }

        /* Navigation Tabs (Bottom) */
        .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; gap: 4px; background: var(--surface); border-top: 1px solid var(--border); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border-radius: 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); min-height: 54px; }
        .tab[aria-current=page] { color: var(--primary); background: var(--primary-soft); }
        .tab-icon { font-size: 20px; }

        main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 0; }
        .vt { font-size: 14px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin: 16px 0 8px 4px; letter-spacing: 0.5px; }

        .layout { display: flex; flex-direction: column; gap: 16px; }
        .forms { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        /* UI Cards & Inputs (Added logic) */
        .ui-card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 16px; border: 1px solid var(--border); }
        .form-group { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .form-group:last-child { border-bottom: none; }
        
        label { font-size: 15px; font-weight: 500; color: var(--text-main); flex-grow: 1; }
        .sub-group { background: var(--surface-2); padding: 8px 12px; margin: 4px -16px; border-bottom: 1px solid var(--border); }
        .sub-group label { font-size: 14px; }
        
        .premium-field { display: none; } .is-logged-in .premium-field { display: flex; }

        input, select {
            width: 110px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px;
            font-size: 16px; text-align: right; background: var(--surface-2); color: var(--text-main);
            font-weight: 600; transition: border 0.2s, background 0.2s; appearance: none;
        }
        select {
            text-align-last: right; padding-right: 28px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23566479%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%0-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 10px auto;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: var(--surface); }
        input::placeholder { color: var(--text-muted); font-weight: 400; }
        
        .full-width { width: 100%; text-align: left; margin-bottom: 12px; }
        .action-btn { width: 100%; background: var(--primary); color: var(--on-primary); padding: 14px; border-radius: 12px; font-weight: 700; text-align: center; margin-top: 8px; transition: opacity 0.2s;}
        .action-btn:active { opacity: 0.8; }
        .btn-sync { background: var(--success); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-main); }
        .btn-danger { background: var(--danger); }

        /* Aside & Hero (Results Panel) - Mobile Defaults */
        .aside {
            position: fixed;
            bottom: calc(76px + env(safe-area-inset-bottom));
            left: 16px; right: 16px; z-index: 20;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        
        /* КРИТИЧНИЙ FIX UX: Ховаємо панель при відкритті клавіатури */
        body:has(input:focus) .aside {
            opacity: 0; pointer-events: none; transform: translateY(20px);
        }

        .hero { background: var(--hero-bg); color: var(--hero-text); border-radius: 20px; padding: 18px 20px; box-shadow: 0 10px 28px rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; gap: 8px; }
        .hero-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--hero-muted); }
        .hero-label { font-weight: 700; color: var(--hero-muted); letter-spacing: 0.05em; text-transform: uppercase; font-size: 11px;}
        .hero-net { font-size: clamp(32px, 9vw, 42px); font-weight: 800; color: var(--hero-net); letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .hero-gross { font-size: 16px; color: var(--hero-text); font-variant-numeric: tabular-nums; font-weight: 600;}

        /* Desktop Layout (>=900px) */
        @media (min-width: 900px) {
            body { padding-bottom: 40px; } /* Видаляємо відступ під таби */
            .tabs { display: none; } /* Ховаємо мобільну навігацію */
            
            .topbar { padding-top: 24px; }
            .view { display: block !important; opacity: 1 !important; transform: none !important; } /* Показуємо обидва views на десктопі */
            
            main {
                display: grid;
                grid-template-columns: 1fr 360px;
                gap: 32px;
                align-items: start;
            }

            .layout { display: contents; }
            .forms-container { display: flex; flex-direction: column; gap: 24px; }

            .aside {
                position: sticky; top: 24px;
                bottom: auto; left: auto; right: auto;
            }

            /* На десктопі не ховаємо aside при фокусі */
            body:has(input:focus) .aside { opacity: 1; pointer-events: all; transform: none; }
        }

        /* Toast */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--text-main); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; box-shadow: var(--shadow); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body id="app-body">

<div id="toast" class="toast"></div>

<!-- Topbar -->
<header class="topbar">
    <div class="brand">
        <div class="mark">₴</div>
        <h1><span data-i18n="title">Калькулятор</span> <span class="pro-badge">PRO</span></h1>
    </div>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Змінити тему">
        <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
</header>

<main>
    <!-- VIEW 1: КАЛЬКУЛЯТОР -->
    <div id="view-calc" class="view active">
        <div class="layout forms-container">
            <div class="forms">
                <!-- Картка 1: Параметри -->
                <div class="vt" data-i18n="cardParams">Параметри</div>
                <div class="ui-card">
                    <div class="form-group">
                        <label data-i18n="month">Місяць</label>
                        <select id="monthSelect"></select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="base">Ставка (zł)</label>
                        <input type="number" inputmode="decimal" id="baseSalary">
                    </div>
                    <div class="form-group">
                        <label data-i18n="bonus">Премія якість</label>
                        <select id="bonusPctSelect">
                            <option value="10" selected>10%</option><option value="5">5%</option><option value="0">0%</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="extraBonus">Додатково (zł)</label>
                        <input type="number" inputmode="decimal" id="extraBonus" placeholder="0">
                    </div>
                </div>

                <!-- Картка 2: Відпрацьовано -->
                <div class="vt" data-i18n="cardShifts">Відпрацьовано</div>
                <div class="ui-card">
                    <div class="form-group">
                        <label data-i18n="schedDays">Графік (Норма)</label>
                        <input type="number" inputmode="decimal" id="scheduleDays" style="color: var(--primary);">
                    </div>
                    <div class="form-group">
                        <label data-i18n="morning">Ранкові (шт)</label>
                        <input type="number" inputmode="decimal" id="morningShifts" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="afternoon">Денні (шт)</label>
                        <input type="number" inputmode="decimal" id="afternoonShifts" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="night">Нічні (шт)</label>
                        <input type="number" inputmode="decimal" id="nightShifts" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="weekend">Вікенди (днів)</label>
                        <input type="number" inputmode="decimal" id="weekendDays" placeholder="0">
                    </div>
                </div>

                <!-- Картка 3: Надгодини -->
                <div class="vt" data-i18n="cardOvertime">Надгодини</div>
                <div class="ui-card">
                    <div class="form-group">
                        <label data-i18n="overtime">Разом (днів)</label>
                        <input type="number" inputmode="decimal" id="overtimeDays" placeholder="0" step="0.5">
                    </div>
                    <div id="overtimeSubGroup" class="hidden">
                        <div class="form-group sub-group">
                            <label data-i18n="overtimeMorning">З них ранкових ☀️</label>
                            <input type="number" inputmode="decimal" id="overtimeMorningShifts" placeholder="0">
                        </div>
                        <div class="form-group sub-group">
                            <label data-i18n="overtimeNight">З них нічних 🌙</label>
                            <input type="number" inputmode="decimal" id="overtimeNightShifts" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- Картка 4: Відсутності (PRO) -->
                <div class="vt premium-field" data-i18n="cardAbsence">Відсутності</div>
                <div class="ui-card premium-field" style="flex-direction: column;">
                    <div class="form-group" style="width: 100%;">
                        <label data-i18n="vacationDays">Відпустка (днів)</label>
                        <input type="number" inputmode="decimal" id="vacationDays" placeholder="0">
                    </div>
                    <div class="form-group sub-group hidden" id="urlopBonusGroup" style="width: 100%;">
                        <label data-i18n="urlopBonus">Сер. за 1 дн. (zł)</label>
                        <input type="number" inputmode="decimal" id="urlopBonus" placeholder="0.00">
                    </div>
                    <div class="form-group" style="width: 100%;">
                        <label data-i18n="bloodDonation">Донація (днів)</label>
                        <input type="number" inputmode="decimal" id="bloodDonationDays" placeholder="0">
                    </div>
                    <div class="form-group sub-group hidden" id="bloodBonusGroup" style="width: 100%;">
                        <label data-i18n="bloodBonus">Сер. за 1 дн. (zł)</label>
                        <input type="number" inputmode="decimal" id="bloodBonus" placeholder="0.00" readonly>
                    </div>
                    <div class="form-group" style="width: 100%;">
                        <label data-i18n="l4Days">Лікарняний L4</label>
                        <input type="number" inputmode="decimal" id="l4Days" placeholder="0">
                    </div>
                    <div class="form-group sub-group hidden" id="l4MissedGroup" style="width: 100%;">
                        <label data-i18n="l4Missed">Пропущено (змін)</label>
                        <input type="number" inputmode="decimal" id="l4MissedShifts" placeholder="0">
                    </div>
                </div>
            </div>
            
            <!-- Sticky Aside for Results -->
            <aside class="aside">
                <div class="hero">
                    <div class="hero-label">NETTO</div>
                    <div class="hero-net" id="netResult">0,00 zł</div>
                    <div class="hero-row" style="margin-top: 8px;">
                        <span>BRUTTO</span>
                        <span class="hero-gross" id="grossResult">0,00 zł</span>
                    </div>
                </div>
                
                <button id="btn-sync-up" class="action-btn btn-sync premium-field" style="margin-top: 12px; display: none;" data-i18n="btnSaveCloud">☁️ Зберегти в хмару</button>
            </aside>
        </div>
    </div>

    <!-- VIEW 2: НАЛАШТУВАННЯ ТА ПРОФІЛЬ -->
    <div id="view-profile" class="view">
        <div class="layout">
            <div class="vt" data-i18n="profHeader">Мій профіль</div>
            <div class="ui-card" style="padding-top:12px; padding-bottom:12px;">
                <label data-i18n="profBase" style="display:block; margin-bottom:4px; font-size:13px;">Стандартна ставка (zł)</label>
                <input type="number" inputmode="decimal" id="profBaseSalary" class="full-width">
                
                <label data-i18n="profAge" style="display:block; margin-bottom:4px; font-size:13px;">Вік до 26 років</label>
                <select id="profUnder26" class="full-width"><option value="no" data-i18n="no">Ні</option><option value="yes" data-i18n="yes">Так</option></select>
                
                <label data-i18n="profPpk" style="display:block; margin-bottom:4px; font-size:13px;">Участь у PPK</label>
                <select id="profPpk" class="full-width"><option value="no" data-i18n="no">Ні</option><option value="yes" data-i18n="yes">Так</option></select>
                
                <label data-i18n="profIns" style="display:block; margin-bottom:4px; font-size:13px;">Додаткове страхування</label>
                <select id="profIns" class="full-width"><option value="yes" data-i18n="yes">Так</option><option value="no" data-i18n="no">Ні</option></select>
                
                <button id="btn-save-profile" class="action-btn" data-i18n="btnSaveProfile">Зберегти профіль</button>
            </div>

            <div class="vt" data-i18n="cloudHeader">Акаунт & Хмара</div>
            <div class="ui-card" style="padding-top:16px; padding-bottom:16px;">
                <div id="auth-container">
                    <input type="email" id="email" placeholder="Email" class="full-width">
                    <input type="password" id="password" data-i18n-ph="pwdPlaceholder" placeholder="Пароль" class="full-width">
                    <button id="btn-login" class="action-btn" data-i18n="btnLogin">Увійти (PRO)</button>
                    <button id="btn-register" class="action-btn btn-outline" data-i18n="btnRegister">Реєстрація</button>
                </div>
                <div id="sync-container" class="hidden">
                    <div id="user-email-display" style="font-size: 14px; margin-bottom: 16px; font-weight: 600; color: var(--primary); text-align: center;"></div>
                    <button id="btn-sync-down" class="action-btn btn-outline" data-i18n="btnLoadCloud">Завантажити з хмари 📥</button>
                    <button id="btn-logout" class="action-btn btn-danger" data-i18n="btnLogout" style="margin-top:24px;">Вийти з акаунту</button>
                </div>
            </div>

            <div class="vt" data-i18n="menuLang">Мова</div>
            <div class="ui-card" style="padding: 16px;">
                <select id="langSelect" class="full-width" style="margin-bottom:0;" onchange="setLang(this.value)">
                    <option value="uk">Українська</option><option value="pl">Polski</option>
                </select>
            </div>
        </div>
    </div>
</main>

<!-- Bottom Navigation Tabs (Mobile Only) -->
<nav class="tabs">
    <button class="tab" aria-current="page" onclick="switchTab('calc')">
        <span class="tab-icon">🔢</span>
        <span data-i18n="tabCalc">Розрахунок</span>
    </button>
    <button class="tab" aria-current="false" onclick="switchTab('profile')">
        <span class="tab-icon">⚙️</span>
        <span data-i18n="tabSettings">Налаштування</span>
    </button>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /* РЕЄСТРАЦІЯ SERVICE WORKER ДЛЯ PWA */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
        });
    }

    /* UI СТАН ТА НАВІГАЦІЯ */
    window.switchTab = function(tabId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.setAttribute('aria-current', 'false'));
        document.getElementById('view-' + tabId).classList.add('active');
        document.querySelector(`[onclick="switchTab('${tabId}')"]`).setAttribute('aria-current', 'page');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.toggleTheme = function() {
        const root = document.documentElement;
        const newTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        document.getElementById('meta-theme-color').content = newTheme === 'dark' ? '#0a0e16' : '#f2f4f8';
    };

    const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('meta-theme-color').content = savedTheme === 'dark' ? '#0a0e16' : '#f2f4f8';

    /* @@PURE:BEGIN ALGORITHMS (АЛГОРИТМИ БЕЗ ЗМІН) */
    const CONFIG = {
        ZUS: 0.1371, NFZ: 0.09, PIT: 0.12, KWOTA_WOLNA: 300.00, LAUNDRY_MAX: 16.00, BENEFIT_ZUS_NFZ: 30.25, BENEFIT_TAX: 54.00,
        EXTRA_INSURANCE_RATE: 36.70, NIGHT_SHIFT_BONUS: 30.00, WEEKEND_DAY_RATE: 100.00, DAILY_HOURS: 8, 
        MIN_WAGES: { 2024: 4300, 2025: 4666, 2026: 4806 }
    };

    function getEaster(year) {
        const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
        return new Date(year, month - 1, day);
    }

    function getNormHours(year, monthIdx) {
        const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
